<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receta</title>
    <link rel="stylesheet" href="./css/global.css " />
    <link rel="stylesheet" href="./css/pages/receta.css" />
    <script
      src="https://kit.fontawesome.com/d189544426.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <h1>Crea tu receta</h1>
    </header>
    <main>
      <form>
        <div class="img-receta">
          <label class="image-upload">
            <input type="file" id="imageInput" accept="image/*" />
            <span class="placeholder">Selecciona una imagen</span>
            <img id="preview" alt="Vista previa" />
          </label>
        </div>
        <div class="info-receta">
          <input
            type="text"
            class="titulo-receta"
            placeholder="Título de la receta"
          />
          <textarea
            type="text"
            class="desc-receta"
            placeholder="Descripción de la receta"
          ></textarea>
        </div>
        <div class="ingredientes">
          <h3>Lista de ingredientes</h3>
          <ul>
            <li><input type="text"> <button><i class="fa-solid fa-minus"></i></button></li>
            <li><input type="text"> <button><i class="fa-solid fa-minus"></i></button></li>
            <li><input type="text"> <button><i class="fa-solid fa-minus"></i></button></li>
          </ul>
          <button class="aniade-ingr">Añadir</button>
        </div>
        <div class="pasos">
          <h2>Pasos de la receta</h2>
          <div class="paso">
            <textarea class="desc-paso"></textarea>
            <div class="btts-receta">
              <button id="anade"><i class="fa-solid fa-plus"></i></button>
              <button id="quita"><i class="fa-solid fa-minus"></i></button>
            </div>
          </div>
          <div class="paso">
            <textarea></textarea>
            <div class="btts-receta">
              <button id="anade"><i class="fa-solid fa-plus"></i></button>
              <button id="quita"><i class="fa-solid fa-minus"></i></button>
            </div>
          </div>
          <div class="paso">
            <textarea class="desc-paso"></textarea>
            <div class="btts-receta">
              <button id="anade"><i class="fa-solid fa-plus"></i></button>
              <button id="quita"><i class="fa-solid fa-minus"></i></button>
            </div>
          </div>
          <div class="paso">
            <textarea class="desc-paso"></textarea>
            <div class="btts-receta">
              <button id="anade"><i class="fa-solid fa-plus"></i></button>
              <button id="quita"><i class="fa-solid fa-minus"></i></button>
            </div>
          </div>
          <div class="paso">
            <textarea class="desc-paso"></textarea>
            <div class="btts-receta">
              <button id="anade"><i class="fa-solid fa-plus"></i></button>
              <button id="quita"><i class="fa-solid fa-minus"></i></button>
            </div>
          </div>
        </div>
        <div class="btts-form">
          <input type="submit" value="Guardar" />
          <input type="reset" value="Limpiar" />
          <input type="button" value="Volver" />
        </div>
      </form>
    </main>
  </body>
</html>
