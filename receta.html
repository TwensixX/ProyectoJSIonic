<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receta</title>
    <link rel="stylesheet" href="./css/global.css " />
    <link rel="stylesheet" href="./css/pages/receta.css" />
    <script
      src="https://kit.fontawesome.com/d189544426.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <h1>Crea tu receta</h1>
    </header>
    <main>
      <form>
        <div class="img-receta">
          <label class="img-upload">
            <input type="file" id="imgInput" accept="image/*" />
            <span class="placeholder">Selecciona una imagen</span>
            <img id="preview" alt="Vista previa" />
          </label>
        </div>
        <div class="info-receta">
          <input
            type="text"
            class="titulo-receta"
            placeholder="Título de la receta"
          />
          <textarea
            type="text"
            class="desc-receta"
            placeholder="Descripción de la receta"
          ></textarea>
        </div>
        <div class="ingredientes">
          <div>
            <h3>Lista de ingredientes</h3>
            <ul>
              <li>
                <input type="text" />
                <button><i class="fa-solid fa-minus"></i></button>
              </li>
            </ul>
            <button class="anade-ingr" id="anadeIngr">Añadir</button>
          </div>
        </div>
        <div class="pasos">
          <h2>Pasos de la receta</h2>
          <div class="paso">
            <textarea placeholder="Freímos la cebolla ..."></textarea>
            <button id="quitaPaso"><i class="fa-solid fa-minus"></i></button>
            <div class="img-paso">
              <label class="img-upload-paso">
                <input type="file" id="imgInput" accept="image/*" />
                <span class="placeholder">Selecciona una imagen del paso</span>
                <img id="preview" alt="Vista previa" />
              </label>
            </div>
          </div>
          <button class="anade-paso" id="anadePaso">Añadir</button>
        </div>
        <div class="btts-form">
          <input type="submit" value="Guardar" />
          <input type="reset" value="Limpiar" />
          <input type="button" value="Volver" />
        </div>
      </form>
    </main>
  </body>
</html>
