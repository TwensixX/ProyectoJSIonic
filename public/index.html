<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inicio</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/index.css" />
    <script
      src="https://kit.fontawesome.com/d189544426.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header>
      <h1>Bienvenido a tu recetario</h1>
    </header>
    <main>
      <div class="filtrar">
        <input
          type="text"
          id="buscador"
          class="buscador"
          placeholder="Buscar receta..."
        />
        <select name="filtroCategoria" class="filtro-categoria" id="filtroCategoria">
          <option value="default" selected>Filtrar por categoría</option>
          <option value="entrante">Entrante</option>
          <option value="plato">Plato</option>
          <option value="postre">Postre</option>
        </select>
      </div>
      <a href="./form-receta.html" class="btn-crea-receta" id="btnCreaReceta"
        >Crea una receta</a
      >
      <div class="lista-recetas" id="listaRecetas"></div>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
