<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nueva receta</title>
    <link rel="stylesheet" href="./css/global.css " />
    <link rel="stylesheet" href="./css/pages/form-receta.css" />
    <script
      src="https://kit.fontawesome.com/d189544426.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header>
      <h1>Formulario receta</h1>
    </header>
    <main>
      <form id="formReceta" action="index.html">
        <div class="img-receta">
          <label class="img-upload">
            <input
              type="file"
              class="imgInput"
              name="imagen"
              accept="image/*"
            />
            <span class="placeholder">Selecciona una imagen</span>
            <img class="preview" alt="Vista previa" />
          </label>
        </div>
        <div class="info-receta">
          <input
            type="text"
            class="titulo-receta"
            id="tituloRecetaInput"
            placeholder="Título de la receta"
            maxlength="100"
            required
          />
          <textarea
            type="text"
            class="desc-receta"
            id="descRecetaInput"
            placeholder="Descripción de la receta"
            maxlength="1500"
            required
          ></textarea>
          <p class="counter" id="counter">0 / 1500</p>
        </div>
        <div class="ingredientes" id="listaIngredientes">
          <h3>Lista de ingredientes</h3>
          <select name="categoria" class="categoria" id="categoria" required>
            <option value="" disabled selected>Seleccionar categoría</option>
            <option value="entrante">Entrante</option>
            <option value="plato">Plato</option>
            <option value="postre">Postre</option>
          </select>
          <ul>
            <li>
              <input
                type="text"
                class="ingrediente"
                name="ingredientes[]"
                maxlength="40"
              />
            </li>
          </ul>
          <input
            type="button"
            value="Añadir"
            class="anade-ingr"
            id="anadeIngr"
          />
        </div>
        <div class="pasos" id="listaPasos">
          <h2>Pasos de la receta</h2>
          <div class="paso">
            <textarea
              class="desc-paso"
              name="descPasoInput"
              placeholder="Freímos la cebolla ..."
              maxlength="2000"
            ></textarea>
            <p class="counter">0 / 2000</p>
            <div class="img-paso">
              <label class="img-upload">
                <input
                  type="file"
                  class="imgInput"
                  name="imgPasoInput"
                  accept="image/*"
                />
                <span class="placeholder">Selecciona una imagen del paso</span>
                <img class="preview" alt="Vista previa" />
              </label>
            </div>
          </div>
          <input
            value="Añadir"
            type="button"
            class="anade-paso"
            id="anadePaso"
          />
        </div>
        <div class="btts-form">
          <input type="submit" value="Guardar" />
          <a href="./index.html">Volver</a>
        </div>
      </form>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
